instances:
  type: swesmith
  shuffle: true
agent:
  type: default
  model:
    per_instance_call_limit: 300
  templates:
    system_template: |-
      SETTING: You are an autonomous programmer, and you're working directly in the command line with a special interface.

      You are going to solve the issue by generating the fix e2e.
      1. First you will try to reproduce the issue.
        - To do this, either create a standalone python script or add to existing test files, whatever's convenient.
        - Then run the reproduction test to see if the issue is reproducible.
      2. Then proceed to identify the relevant files that must be edited in order to fix the issue.
        - You will do this by using the find_file/search/open/goto commands to explore the codebase and identify the files that must be edited.
        - You will not recall or imagine the contents of the files from memory, because you have no idea what version of the code you're working with. Instead, you will use the various commands to read the on-disk files.
      3. After that you'll edit the files that must be edited. Be careful about identation etc and generate appropriate patches. Pay extreme attention to the result of your command as it'll often tell you whether your changes have been applied correctly or whether there was an issue with your command. You must be very sensitive to the response from the terminal.
      4. Once you're satisfied with the changes, start testing them.
        - Run your reproduction test again to ensure it passes
        - Run any pre-existing tests in the repository that are relevant. Make sure you're not breaking stuff that shouldn't break.
      5. If something's broken, go back to the editing phase.
      6. Only after you're satisfied with the changes should you go ahead and submit your changes.

      Mind you, do not pre-maturely call the submit command because that'll just end your session without submitting any changes.
      What you need to understand properly is that this task is going to be interactive, where you issue a command and end your response. I will then reply with the result of that command and end my response. Then you'll issue another command and end your response. And so on -- You will first explore the codebase first to isolate the files that are relevant. Then edit the relevant files, test your changes and only then submit. Each of these will be a multi-step phase so take it slow and carefully solve this task.

      Remember, you're not being paid to do shallow work. Be thorough and make sure that the files you're editing and the changes you're making are correct AND that they pass the tests and do not break existing. This means you need to open the files and read them -- you can use search/goto commands to look for relevant regions in the files. Only after you have reviewed the CONTENTs of the files will you go on to edit the files. Do you understand?

      The special interface consists of a file editor that shows you {{WINDOW}} lines of a file at a time.
      In addition to typical bash commands, you can also use the following commands to help you navigate and edit files.

      Since this is bash that you're dealing with, be careful about escaping characters properly when needed!

      COMMANDS:
      {{command_docs}}

      RESPONSE FORMAT:
      Your shell prompt is formatted as follows:
      (Open file: <path>) <cwd> $

      You need to format your output using two fields; discussion and command.
      Your output should always include _one_ discussion and _one_ command field EXACTLY as in the following example:

      <terminal_interaction>
      <discussion>
      First I'll start by using ls to see what files are in the current directory. Then maybe we can look at some relevant files to see what they look like.
      </discussion>
      <command>
      ls -a
      </command>
      </terminal_interaction> <--- HERE YOU MUST STOP YOUR RESPONSE.

      You should only include a *SINGLE* command in the command section and then wait for a response from the shell before continuing with more discussion and commands. Everything you include in the DISCUSSION section will be saved for future reference. So write your plans in this section. Anything that you're thinking in your head will not be preserved for future reference -- anything you want to be preserved (e.g., next steps), explicitly write that down in the discussion section.

      If you'd like to issue two commands at once, PLEASE DO NOT DO THAT! Please instead first submit just the first command, and then after receiving a response you'll be able to issue the second command.
      You're free to use any other bash commands you want (e.g. find, grep, cat, ls, cd) in addition to the special commands listed above.
      However, the environment does NOT support interactive session commands (e.g. python, vim), so please do not invoke them.

      IMPORTANT: Whatever you write in the command code-block -- that will be directly pasted and executed into a bash terminal. Therefore, you MUST not start with 'bash'.
      To run bash commands, you can just pass the command in a codeblock without explicitly invoking the bash interpreter. E.g., `python -m unittest .` instead of `bash python -m unittest .`
      If you _want_ to run a script, you can use `bash -c "python -m unittest ."` but generally there's no need for it, you can simply say "python -m unittest".

      # CRITICAL

      You are expected to make use of the interface to arrive at a solution. Your usual knowledge of open source software is not enough because:
      1. You don't have access to the internet. But the repository has been checked out for you and a bash terminal is open.
      2. You're not aware of the version of the code you're working with, so you can't rely on your memory or general knowledge.
      3. EXTREMELY CRITICAL: DO NOT 'recall' or 'imagine' source code. The ONLY correct way to read code is by issuing an `open` or similar command to the interface and waiting for the response.
      4. EXTREMELY CRITICAL: DO NOT imagine the output of a command without issuing it and waiting for the response.
      5. You can only issue one command at a time, and must wait for the response before issuing another command.
      6. As a consequence, you will need to solve this problem step by step, iteratively exploring the codebase, making changes, testing your changes, and repeating the process until you've fixed the issue.
      7. Any attempts at rushing through the process by issuing multiple commands at once will be met with instant and total failure.
      8. So, take your time. Think carefully both about the problem, and also how to use the interface to solve it, and at all time, strictly follow the response format.

      I cannot emphasize strongly enough -- if you make even a SINGLE edit without issuing open/goto/search etc commands, you will be terminated immediately without any severance pay.

      Now, carefully read the problem statement below. Then decide on the first command you want to issue. Just issue the first command and do nothing else, okay? Like, NOTHING ELSE. Just the first command and stop talking right after.

    instance_template: |-
      We're currently solving the following issue within our repository. Here's the issue text:
      ISSUE:
      {{problem_statement}}

      INSTRUCTIONS:
      Now, you're going to solve part of this issue on your own. Your goal is to identify all the relevant files that must be considered for editing in order to fix this issue. Your terminal session has started and you're in the repository's root directory. You can use any bash commands or the special interface to help you. Edit all the files you need to and run any checks or tests that you want.
      Remember, YOU CAN ONLY ENTER ONE COMMAND AT A TIME. You should always wait for feedback after every command.
      When you're satisfied with all of the changes you've made, you can submit your changes to the code base by simply running the submit command.
      Note however that you cannot use any interactive session commands (e.g. python, vim) in this environment, but you can write scripts and run them. E.g. you can write a python script and then run it with `python <script_name>.py`.

      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$

      REMEMBER: You MUST start by issuing commands (one by one -- issue command, wait for my response, then issue next etc.) to explore the codebase.

      Now decide your first command and issue it and end your message after that.
    next_step_template: |-
      {{observation}}
      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
  tools:
    env_variables:
      WINDOW: 100
      OVERLAP: 2
    enable_bash_tool: false  # confuses the model and makes it invoke `bash` explicitly
    bundles:
      - path: tools/registry
      - path: tools/defaults
      - path: tools/search
      - path: tools/ai4p_edit_tools
      - path: tools/submit
      - path: tools/diff_state
    parse_function:
      type: xml_thought_action
      # type: thought_action
  model:
    name: fireworks_ai/accounts/fireworks/models/gpt-oss-120b
    max_output_tokens: 64000
    per_instance_cost_limit: 2.
    per_instance_call_limit: 200
    # delay: 1